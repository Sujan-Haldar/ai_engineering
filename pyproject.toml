[project]
name = "ai-engineering-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sujan Haldar", email = "hsujan122@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.21",
    "langsmith>=0.14.17",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-engineering-py = "ai_engineering_py:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
